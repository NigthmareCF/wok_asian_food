server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: wok-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wok}
    username: ${SPRING_DATASOURCE_USERNAME:wok}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:filesystem:../../database/migrations}
    default-schema: public
    create-schemas: false
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    path: /api/v1/openapi
wok:
  auth:
    issuer: wok-asian-food
    jwt-secret-base64: ${WOK_AUTH_JWT_SECRET_BASE64:}
    challenge-pepper-base64: ${WOK_AUTH_CHALLENGE_PEPPER_BASE64:}
    access-minutes: 15
    refresh-days: 30
  ai:
    mode: ${WOK_AI_MODE:disabled}
  email:
    mode: ${WOK_EMAIL_MODE:mock}
