services:
  nginx:
    ports:
      - "${WOK_HTTPS_BIND_ADDRESS:-0.0.0.0}:${WOK_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WOK_TLS_CERT_PATH:?Set WOK_TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${WOK_TLS_KEY_PATH:?Set WOK_TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
